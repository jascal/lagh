# Hermes Agent (MiniMax-backed MCP host) + lagh (certified-law MCP server), one container.
# Start:   cd deploy/hermes && cp .env.example .env && $EDITOR .env && docker compose up -d --build
# Use:     docker compose exec -it hermes hermes           # interactive agent; lagh tools available
# Verify:  docker compose exec -it hermes hermes mcp test lagh
# Stop:    docker compose down          (state persists in the named volume)
services:
  hermes:
    build: .
    image: lagh-hermes:latest
    container_name: lagh-hermes
    stdin_open: true          # so `docker compose exec -it hermes hermes` is interactive
    tty: true
    environment:
      # Backing model, provider-agnostic. Values come from .env (gitignored); swap providers
      # by editing .env then `docker compose up -d` (recreates + regenerates the Hermes config).
      LLM_MODEL: "${LLM_MODEL:-MiniMax-M3}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.minimax.io/anthropic}"
      LLM_API_KEY: "${LLM_API_KEY:?set LLM_API_KEY in deploy/hermes/.env}"
      # api_mode MUST be forwarded or gen_config always defaults to the OpenAI dialect:
      # empty = OpenAI (Grok/GPT); 'anthropic_messages' = MiniMax's /anthropic endpoint.
      LLM_API_MODE: "${LLM_API_MODE:-}"
      LLM_PROVIDER_NAME: "${LLM_PROVIDER_NAME:-model}"
      # which lab benchmark to serve: proxy (self-contained) or newtonbench (real dev cells)
      LAB_SOURCE: "${LAB_SOURCE:-proxy}"
      NEWTONBENCH_DIR: /opt/NewtonBench
    volumes:
      # the lagh source (so its MCP server + live edits are in the container)
      - ../../:/opt/lagh
      # NewtonBench checkout (read-only) so the `newtonbench` lab source can query it
      - ../../../NewtonBench:/opt/NewtonBench:ro
      # persist Hermes config / sessions / logs across restarts
      - hermes-home:/root/.hermes
volumes:
  hermes-home:
